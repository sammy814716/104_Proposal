<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>104 職涯探索首頁 - 手機版 Prototype</title>
<style>
  :root {
    --orange: #FF6B19;
    --orange-light: #FFF1E6;
    --blue: #1A64C4;
    --blue-light: #EAF2FD;
    --ink: #222222;
    --sub: #6B6B6B;
    --line: #E9E9E9;
    --bg: #F5F5F3;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .frame {
    max-width: 414px;
    margin: 0 auto;
    background: var(--bg);
    min-height: 100vh;
    padding-bottom: 24px;
    position: relative;
  }

  header.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .topbar .logo { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 18px; }
  .topbar .logo .n104 { color: var(--orange); }
  .topbar .icons { display: flex; align-items: center; gap: 16px; font-size: 18px; color: #444; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--orange-light); display: flex; align-items: center; justify-content: center; font-size: 14px; }

  section { padding: 18px 16px 6px; }
  .section-title { font-size: 16px; font-weight: 700; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
  .section-title .bar { width: 4px; height: 16px; background: var(--orange); border-radius: 2px; display: inline-block; }
  .section-sub { font-size: 12.5px; color: var(--sub); margin: -6px 0 12px; }
  .order-toggle-btn { border: none; background: none; font-size: 12px; font-weight: 700; color: var(--blue); cursor: pointer; font-family: inherit; padding: 4px 0; }
  .order-row {
    display: flex; align-items: center; gap: 10px; padding: 12px 12px;
    border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; background: #fff;
  }
  .order-row.dragging { opacity: .55; border-color: var(--orange); }
  .order-drag-handle { font-size: 16px; color: var(--sub); cursor: grab; touch-action: none; user-select: none; }
  .order-row-label { flex: 1; font-size: 14px; font-weight: 700; }
  .order-row.hidden-section { background: #FAFAFA; }
  .order-row.hidden-section .order-row-label { color: var(--sub); }
  .order-visibility-btn { flex: 0 0 auto; border: none; border-radius: 8px; padding: 6px 12px; font-size: 11.5px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .order-visibility-btn.on { background: var(--blue-light); color: var(--blue); }
  .order-visibility-btn.off { background: #F0F0EE; color: var(--sub); }

  /* 01 需求選擇 */
  .need-row { display: flex; flex-direction: column; gap: 10px; }
  .need-card {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .need-card .icon-circle {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
    background: var(--orange-light); display: flex; align-items: center; justify-content: center; font-size: 19px;
  }
  .need-card .need-text { flex: 1; min-width: 0; }
  .need-card .title { font-size: 14.5px; font-weight: 700; margin-bottom: 2px; }
  .need-card .desc { font-size: 11.5px; color: var(--sub); line-height: 1.4; }
  .need-card .radio {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); position: relative;
  }
  .need-card.active { border-color: var(--orange); background: var(--orange-light); }
  .need-card.active .title { color: var(--orange); }
  .need-card.active .radio { border-color: var(--orange); background: var(--orange); }
  .need-card.active .radio::after {
    content: ""; position: absolute; inset: 4px; background: #fff; border-radius: 50%;
  }
  .need-hint { font-size: 12px; color: var(--sub); margin-top: 8px; }
  .need-hint button { border: none; background: none; color: var(--blue); font-size: 12px; cursor: pointer; padding: 0; text-decoration: underline; }
  .reset-btn { border: none; background: none; font: inherit; text-align: left; width: 100%; color: inherit; }

  .need-carousel-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .need-carousel-card {
    flex: 0 0 auto; width: 132px; position: relative;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 14px;
    padding: 16px 10px 14px; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .need-carousel-card .icon-circle { margin-bottom: 8px; }
  .need-carousel-card .title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .need-carousel-card .desc { font-size: 10.5px; color: var(--sub); line-height: 1.4; }
  .need-carousel-card.active { border-color: var(--orange); background: var(--orange-light); }
  .need-carousel-card.active .title { color: var(--orange); }
  .need-check {
    position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; background: var(--orange);
    color: #fff; border-radius: 50%; font-size: 10.5px; display: flex; align-items: center; justify-content: center;
  }

  .personalize-banner {
    margin: 0 16px 14px;
    padding: 10px 12px;
    border-radius: 10px;
    background: #E9E9E6;
    color: var(--sub);
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .personalize-banner b { color: var(--orange); font-weight: 700; }
  .personalize-main { font-size: 12.5px; color: var(--ink); }
  .personalize-detail { display: flex; flex-direction: column; gap: 3px; padding-top: 4px; border-top: 1px dashed #D8D8D4; }
  .personalize-item { font-size: 11px; color: var(--sub); line-height: 1.5; }


  /* 02 個人化工具 */
  .field-block { margin-bottom: 12px; }
  .field-label { font-size: 12px; color: var(--sub); margin-bottom: 6px; display: block; }
  .native-select {
    width: 100%;
    font-size: 14.5px;
    font-weight: 700;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--ink);
    background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%236B6B6B"><path d="M7 10l5 5 5-5z"/></svg>') no-repeat right 10px center;
    appearance: none;
    -webkit-appearance: none;
  }
  .native-select.target { border-color: var(--orange); color: var(--orange); background-color: var(--orange-light); }
  .placeholder-note {
    display: flex; align-items: center; gap: 8px;
    background: #FAFAFA; border: 1px dashed var(--line); border-radius: 10px;
    padding: 12px; font-size: 12.5px; color: var(--sub); margin-top: 4px;
  }
  .personality-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(90deg,#FFF1E6,#FFE3CC);
    color: var(--orange); font-weight: 700; font-size: 12.5px;
    padding: 8px 12px; border-radius: 10px; margin-bottom: 12px;
  }
  .test-gate-text { font-size: 12.5px; color: var(--sub); line-height: 1.6; margin-bottom: 14px; }
  .test-skip-link {
    display: block; text-align: center; font-size: 12.5px; color: var(--sub);
    text-decoration: underline; margin-top: 10px; cursor: pointer; background: none; border: none; width: 100%; font-family: inherit;
  }
  .nudge-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--blue-light); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px;
  }
  .nudge-banner span { font-size: 12px; color: var(--blue); line-height: 1.5; }
  .nudge-banner button {
    flex: 0 0 auto; background: var(--blue); color: #fff; border: none; border-radius: 8px;
    padding: 7px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .secondary-block { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .secondary-heading { font-size: 12.5px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .tool-card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    border: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .tool-card .job-label { font-size: 13px; color: var(--sub); }

  .skill-gap-card { margin-top: 10px; margin-bottom: 4px; background: var(--orange-light); border-radius: 12px; padding: 14px; }
  .skill-gap-heading { font-size: 13.5px; font-weight: 700; margin-bottom: 10px; }
  .skill-tab-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .skill-tab {
    flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 20px;
    padding: 6px 4px; font-size: 11px; font-weight: 700; color: var(--sub); cursor: pointer; white-space: nowrap;
  }
  .skill-tab.active { background: var(--orange); border-color: var(--orange); color: #fff; }
  .skill-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .skill-chip { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 5px 10px; font-size: 11.5px; color: var(--ink); }
  .skill-gap-carousel-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
  .skill-gap-card-item {
    flex: 0 0 auto; width: 160px; display: flex; flex-direction: column; gap: 8px;
    background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  }
  .skill-gap-card-item .skill-name { font-size: 13px; font-weight: 700; color: var(--ink); }
  .skill-gap-card-item .skill-course { font-size: 11px; color: var(--blue); line-height: 1.4; }
  .plan-add-btn {
    background: var(--blue-light); color: var(--blue); border: none; border-radius: 8px;
    padding: 7px 10px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .skill-gap-card-item .plan-add-btn { width: 100%; }
  .plan-add-btn.added { background: var(--orange); color: #fff; }
  .trait-card .plan-add-btn { width: 100%; margin-top: 10px; }
  .jobsearch-tool-card .plan-add-btn { width: 100%; margin-top: 10px; }

  .similar-jobs-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .similar-jobs-table tr { border-bottom: 1px solid var(--line); }
  .similar-jobs-table tr:last-child { border-bottom: none; }
  .similar-jobs-table td { padding: 10px 2px; }
  .similar-jobs-table td.salary { text-align: right; color: var(--blue); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .skill-stats { font-size: 11px; color: var(--sub); }
  .skill-stats b { color: var(--ink); }

  .plan-card { background: #fff; border: 1.5px solid var(--orange); border-radius: 14px; padding: 16px; margin-top: 14px; }
  .plan-progress-track { height: 8px; background: #F0F0EE; border-radius: 4px; overflow: hidden; margin: 4px 0 6px; }
  .plan-progress-fill { height: 100%; background: var(--orange); }
  .plan-progress-label { font-size: 11.5px; color: var(--sub); margin-bottom: 10px; }
  .plan-filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .plan-filter-row .native-select { flex: 0 0 auto; width: auto; font-size: 12px; padding: 6px 10px; }
  .plan-delete-checked-btn {
    margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font-size: 12px; color: var(--sub); cursor: pointer; font-family: inherit;
  }
  .plan-delete-checked-btn:disabled { opacity: .4; cursor: not-allowed; }
  .plan-checklist-item {
    display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12.5px;
  }
  .plan-checklist-item:last-of-type { border-bottom: none; }
  .plan-checklist-item input[type="checkbox"] { width: 16px; height: 16px; flex: 0 0 auto; }
  .plan-checklist-item.done .plan-item-text { text-decoration: line-through; color: var(--sub); }

  .trait-carousel-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; margin-top: 4px; }
  .trait-card { flex: 0 0 auto; width: 250px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .trait-fit { display: inline-block; background: #E6F7F3; color: #1A9E7C; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; margin-right: 6px; }
  .trait-name-text { font-size: 15px; font-weight: 700; }
  .trait-salary-row { font-size: 12.5px; color: var(--sub); margin-top: 8px; }
  .trait-salary-row .trend { color: #2E9A50; font-weight: 700; margin-left: 4px; }
  .trait-desc-label { font-size: 11.5px; font-weight: 700; color: var(--ink); margin-top: 10px; }
  .trait-desc-text { font-size: 12px; color: var(--sub); line-height: 1.6; margin-top: 3px; }
  .job-content-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
  .trait-tools { font-size: 11.5px; color: var(--sub); margin-top: 6px; }
  .trait-prompt { font-size: 12.5px; color: var(--blue); font-weight: 600; margin-top: 10px; }
  .trait-attrs { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
  .trait-attr { flex: 1; text-align: center; }
  .trait-attr-name { font-size: 10.5px; color: var(--sub); margin-bottom: 6px; }
  .trait-dots { color: var(--orange); font-size: 13px; letter-spacing: 2px; }
  .trait-jobs { display: block; text-align: center; padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--line); color: var(--blue); font-weight: 700; font-size: 12.5px; }

  .job-carousel-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-top: 4px; }
  .job-carousel-card {
    flex: 0 0 auto; width: 140px; text-align: left;
    padding: 12px; background: #FAFAFA; border-radius: 12px; font-size: 13px;
    cursor: pointer; border: 1px solid var(--line);
  }
  .job-carousel-card.selected { border-color: var(--orange); background: var(--orange-light); }
  .job-carousel-card.static { cursor: default; }
  .job-carousel-name { display: block; font-weight: 700; margin-bottom: 6px; }
  .job-carousel-salary { display: block; color: var(--blue); font-weight: 600; font-size: 12.5px; }
  .tool-cta {
    display: block; width: 100%; box-sizing: border-box; text-align: center; background: var(--orange);
    color: #fff; font-size: 14px; font-weight: 700; padding: 11px; border-radius: 10px;
    border: none; margin-top: 4px; cursor: pointer; text-decoration: none;
  }
  .tool-cta.ghost { background: #fff; color: var(--orange); border: 1.5px solid var(--orange); }
  .tool-cta.disabled { background: #E3E0DA; color: #A39A8E; cursor: not-allowed; font-family: inherit; }

  .mini-label { font-size: 11.5px; font-weight: 700; color: var(--sub); margin: 4px 0 8px; }
  .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
  .filter-chip {
    flex: 0 0 auto; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--line);
    background: #fff; font-size: 12.5px; font-family: inherit; color: var(--sub); font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  .filter-chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .empty-note { font-size: 12.5px; color: var(--sub); padding: 14px; text-align: center; }
  .carousel-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 4px; }
  .carousel-card {
    flex: 0 0 auto; width: 190px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px;
  }
  .carousel-card .title { font-size: 13px; font-weight: 700; margin: 8px 0 4px; line-height: 1.4; }
  .carousel-card .cta {
    display: block; text-align: center; margin-top: 10px; padding: 7px;
    border-radius: 8px; background: var(--orange-light); color: var(--orange); font-size: 12px; font-weight: 700;
  }
  .carousel-card .cta.blue { background: var(--blue-light); color: var(--blue); }

  .classroom-follow-btn { background: var(--blue-light); color: var(--blue); border: none; border-radius: 8px; padding: 6px 14px; font-size: 11.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .classroom-follow-btn.followed { background: var(--orange); color: #fff; }
  a.feed-card { text-decoration: none; color: inherit; display: block; }

  .jobsearch-carousel-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .jobsearch-tool-card {
    flex: 0 0 auto; width: 148px; display: flex; flex-direction: column; align-items: center; text-align: center;
    background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 12px 14px;
  }
  .jobsearch-tool-icon { font-size: 20px; flex: 0 0 auto; width: 38px; height: 38px; background: var(--orange-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .jobsearch-tool-title { font-size: 13px; font-weight: 700; }
  .jobsearch-tool-desc { font-size: 11px; color: var(--sub); margin-top: 4px; line-height: 1.4; }
  .jobsearch-tool-cta { display: block; box-sizing: border-box; width: 100%; margin-top: auto; background: var(--orange); color: #fff; border: none; border-radius: 8px; padding: 8px 6px; font-size: 11.5px; font-weight: 700; cursor: pointer; font-family: inherit; text-align: center; text-decoration: none; }

  /* 03 / 04 feed */
  .feed-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .tag-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .feed-badge {
    margin-left: auto; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
    background: #F0F0EE; color: var(--sub);
  }
  .feed-badge.on { background: var(--ink); color: #fff; }
  .feed-badge.on::before { content: "✨ "; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
  .tag.article { background: var(--blue-light); color: var(--blue); }
  .tag.course { background: #F3ECFB; color: #7A3FC4; }
  .tag.quiz { background: #ECF8EE; color: #2E9A50; }
  .tag.post { background: var(--orange-light); color: var(--orange); }
  .tag.classroom { background: #EAF6F2; color: #1A9E7C; }
  .tag.cert { background: #FDF3D8; color: #9A6B00; }
  .feed-source { font-size: 11px; color: var(--sub); }
  .feed-title { font-size: 14.5px; font-weight: 700; margin: 2px 0 4px; line-height: 1.4; }
  .feed-desc { font-size: 12.5px; color: var(--sub); line-height: 1.5; }
  .feed-actions { display: flex; gap: 16px; margin-top: 10px; font-size: 11.5px; color: var(--sub); }
  .content-hub-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .content-hub-header .l1-tag-row {
    flex: 1; min-width: 0; margin-bottom: 0; gap: 4px;
    background: #F1EFEA; border-radius: 12px; padding: 4px;
  }
  .content-hub-header .order-toggle-btn { flex: 0 0 auto; white-space: nowrap; }
  .l1-tag-row .filter-chip {
    font-size: 13px; font-weight: 700; padding: 8px 16px; border: none;
    background: transparent; color: var(--sub); border-radius: 9px;
  }
  .l1-tag-row .filter-chip.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(33,31,29,0.14); }
  #contentIntro.section-sub { margin: 0 2px 12px; }
  .content-hub-l2-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .content-hub-l2-row .l2-tag-row { flex: 1; min-width: 0; margin-bottom: 0; }
  .l2-tag-row .filter-chip { font-size: 11px; font-weight: 600; padding: 5px 12px; }
  .see-more-link { flex: 0 0 auto; font-size: 12px; font-weight: 700; color: var(--blue); text-decoration: none; white-space: nowrap; }
  .feed-cta { display: inline-block; margin-top: 8px; padding: 6px 14px; border-radius: 8px; background: var(--orange-light); color: var(--orange); font-size: 11.5px; font-weight: 700; }
  .feed-cta.blue { background: var(--blue-light); color: var(--blue); }
  .feed-cta.gold { background: #FDF3D8; color: #9A6B00; }
  .feed-end-note { text-align: center; font-size: 11.5px; color: var(--sub); padding: 18px 0 6px; }
  #contentFeed { transition: opacity .15s ease; }
  #contentFeed.feed-swapping { opacity: .35; }

  .salary-pr-card { margin-bottom: 14px; }
  .salary-pr-inner { background: var(--orange-light); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .salary-pr-row-line { font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .salary-pr-edit-btn { background: none; border: none; font-size: 13px; cursor: pointer; padding: 0; line-height: 1; }
  .salary-pr-k { color: var(--ink); font-weight: 600; margin-right: 6px; }
  .salary-pr-v { color: var(--blue); font-weight: 700; }
  .salary-pr-region { font-size: 12.5px; color: var(--sub); }
  .salary-pr-fields { display: flex; gap: 10px; }
  .salary-pr-fields .field-block { flex: 1; }

function updateSalaryPR(p25, median, p75, jobName, value) {
  // 使用者輸入的是實際月薪金額（例如 46000），但 p25/median/p75 是以「萬」為單位儲存，
  // 換算成同樣的「萬」單位才能正確比較
  const v = parseFloat(value) / 10000;
  const pctEl = document.getElementById("salaryPRPct");
  const thumbEl = document.getElementById("salaryPRThumb");
  const tooltipEl = document.getElementById("salaryPRTooltip");
  if (!pctEl || !value || isNaN(v) || v <= 0) {
    if (pctEl) pctEl.textContent = "?";
    if (thumbEl) thumbEl.style.left = "50%";
    if (tooltipEl) tooltipEl.style.left = "50%";
    return;
  }
  let pct;
  if (v <= p25) pct = 25 * (v / p25);
  else if (v <= median) pct = 25 + (v - p25) / (median - p25) * 25;
  else if (v <= p75) pct = 50 + (v - median) / (p75 - median) * 25;
  else pct = 75 + (v - p75) / (p75 - median) * 25;
  pct = Math.max(1, Math.min(99, Math.round(pct)));
  pctEl.textContent = pct;

  let posPct = ((v - p25) / (p75 - p25)) * 100;
  posPct = Math.max(0, Math.min(100, posPct));
  thumbEl.style.left = posPct + "%";
  tooltipEl.style.left = posPct + "%";
}

function renderPlanPanelBody() {
  const el = document.getElementById("planPanelBody");
  const plan = state.actionPlan;

  if (!plan.items.length) {
    el.innerHTML = `<div class="search-hint">還沒有加入任何項目。到「必備技能」缺口卡片、職務推薦卡或求職服務卡，點擊「+ 加入清單」開始規劃你的職涯行動清單吧！</div>`;
    return;
  }

  const filter = state.planStatusFilter || "全部";
  const filtered = plan.items.filter(it => {
    if (filter === "已執行") return !!plan.completed[it.id];
    if (filter === "未完成") return !plan.completed[it.id];
    return true;
  });
  const total = plan.items.length;
  const doneCount = plan.items.filter(i => plan.completed[i.id]).length;
  const checkedCount = doneCount;
  const pct = total ? Math.round((doneCount / total) * 100) : 0;

  const filterRow = `
    <div class="plan-filter-row">
      <select class="native-select" onchange="setPlanStatusFilter(this.value)">
        ${["全部", "未完成", "已執行"].map(f => `<option value="${f}" ${filter === f ? "selected" : ""}>${f}</option>`).join("")}
      </select>
      <button type="button" class="plan-delete-checked-btn" ${checkedCount ? "" : "disabled"} onclick="deleteCheckedItems()">刪除已勾選（${checkedCount}）</button>
    </div>`;

  const checklist = filtered.length ? filtered.map(it => `
    <label class="plan-checklist-item ${plan.completed[it.id] ? "done" : ""}">
      <input type="checkbox" ${plan.completed[it.id] ? "checked" : ""} onchange="toggleActionComplete('${it.id}')" />
      <span class="plan-item-text">${it.title}${it.note ? `（${it.note}）` : ""}</span>
    </label>`).join("") : `<div class="empty-note">這個篩選條件下沒有項目</div>`;

  el.innerHTML = `
    <div class="plan-card" style="margin-top:0;border:none;padding:0;">
      <div class="plan-progress-track"><div class="plan-progress-fill" style="width:${pct}%"></div></div>
      <div class="plan-progress-label">完成進度 ${doneCount}/${total}（${pct}%）</div>
      ${filterRow}
      ${checklist}
    </div>`;
}

    <div class="secondary-block">
      <div class="secondary-heading">${block.heading}</div>
      <table class="similar-jobs-table">${rows}</table>
    </div>`;
}

function renderTraitCards(items) {
  const cards = items.map(it => {
    const added = state.actionPlan.items.some(i => i.id === it.name);
    return `
    <div class="trait-card">
      <span class="trait-fit">${it.fit}</span><span class="trait-name-text">${it.name}</span>
      <div class="trait-salary-row">💰 月薪中位數 ${it.salary}${it.trend ? ` <span class="trend">${it.trend}</span>` : ""}</div>
      <div class="trait-desc-label">工作中會做什麼？</div>
      <div class="trait-desc-text">${it.desc}</div>
      <div class="trait-tools">你可能會接觸：${it.tools}</div>
      <div class="trait-attrs">${it.traits.map(t => `
        <div class="trait-attr">
          <div class="trait-attr-name">${t.name}</div>
          <div class="trait-dots">${"●".repeat(t.rating)}${"○".repeat(3 - t.rating)}</div>
        </div>`).join("")}</div>
      <div class="trait-prompt">探索重點：${it.prompt}</div>
      <span class="trait-jobs">工作機會 (${it.jobs})</span>
      <button type="button" class="plan-add-btn ${added ? "added" : ""}" onclick="toggleActionItem('${it.name}', '${it.name}', '列入深入了解清單')">${added ? "✓ 已加入" : "+ 加入清單"}</button>
    </div>`;
  }).join("");
  return `
    <div class="secondary-block">
      <div class="secondary-heading">依據你的性格，這些職業也適合你</div>
      <div class="trait-carousel-row">${cards}</div>
    </div>`;
}

function renderToolForNeed(key) {
  const d = DATA[key].tool;

  if (key === "explore") {
    const t = d.test;
    const ts = state.exploreTest;

    if (ts.taken) {
      return `
        <div class="tool-card">
          <div class="personality-tag">🧬 測驗結果：你是「${ts.personalityType}」人才</div>
          ${renderTraitCards(d.traitCards)}
          ${renderSecondaryList({ heading: "其他熱門職務方向", items: d.candidates })}
          <button type="button" class="test-skip-link" onclick="resetExplore()">重新測驗</button>
        </div>`;
    }

    if (ts.skipped) {
      return `
        <div class="tool-card">
          <div class="nudge-banner">
            <span>📋 完成職場性格測驗，獲得更準確的職務推薦</span>
            <button type="button" onclick="goToTest()">前往測驗</button>
          </div>
          ${renderSecondaryList({ heading: "熱門職務方向", items: d.candidates })}
        </div>`;
    }

    return `
      <div class="tool-card">
        <div class="job-label" style="margin-bottom:4px;">${t.intro}</div>
        <div class="test-gate-text">${t.introSub}</div>
        <button class="tool-cta" onclick="goToTest()">${t.ctaText}</button>
        <button type="button" class="test-skip-link" onclick="skipTest()">${t.skipText}</button>
      </div>`;
  }

  if (key === "jobsearch") {
    return `
      <div class="tool-card">
        <div class="job-label" style="margin-bottom:10px;">求職衝刺期，優先用這些工具加快腳步</div>
        <div class="jobsearch-carousel-row">
          ${d.giverTools.map(tool => {
            const added = state.actionPlan.items.some(i => i.id === tool.title);
            return `
            <div class="jobsearch-tool-card">
              <span class="jobsearch-tool-icon">${tool.icon}</span>
              <div class="jobsearch-tool-title">${tool.title}</div>
              <div class="jobsearch-tool-desc">${tool.desc}</div>
              <a class="jobsearch-tool-cta" href="${tool.url}" target="_blank" rel="noopener">${tool.cta}</a>
              <button type="button" class="plan-add-btn ${added ? "added" : ""}" onclick="toggleActionItem('${tool.title}', '${tool.title}', '安排時間完成這項服務')">${added ? "✓ 已加入" : "+ 加入清單"}</button>
            </div>`;
          }).join("")}
        </div>
        <p style="font-size:11px;color:var(--sub);margin-top:10px;text-align:center;">服務由 104 Giver 職涯顧問提供</p>
      </div>`;
  }

  if (d.candidates) {
    const jobIndex = key in state.jobIndexByNeed ? state.jobIndexByNeed[key] : null;
    const ctaHtml = jobIndex !== null
      ? `<a class="tool-cta ${d.ctaGhost ? "ghost" : ""}" href="${SKILL_GAP_URL}" target="_blank" rel="noopener">${d.ctaText}</a>`
      : `<button type="button" class="tool-cta disabled" disabled title="請先選擇目標職務">${d.ctaText}</button>`;
    return `
      <div class="tool-card">
        ${buildTargetSelector(key, d)}
        ${renderSimilarJobsTable(d.similarJobs)}
        ${ctaHtml}
      </div>`;
  }

  if (!d.currentJobOptions) {
    return `
      <div class="tool-card">
        <button class="tool-cta ${d.ctaGhost ? "ghost" : ""}">${d.ctaText}</button>
      </div>`;
  }

  const names = currentJobNames(d);
  const picked = state.baseJobByNeed[key] || names[0];
  const active = d.currentJobOptions.find(o => o.name === picked);
  return `
    <div class="tool-card">
      ${key === "growth" ? renderSalaryPRCard(active) : ""}
      ${renderSkillGapCard(key, active)}
      ${renderSimilarJobsTable(d.similarJobs)}
      <a class="tool-cta ${d.ctaGhost ? "ghost" : ""}" href="${GROWTH_SKILL_GAP_URL}" target="_blank" rel="noopener">${d.ctaText}</a>
    </div>`;
}

function renderTool() {
  document.getElementById("toolArea").innerHTML = renderToolForNeed(state.need);
}

function selectJob(needKey, i) { state.jobIndexByNeed[needKey] = i; state.skillTabByNeed[needKey] = "missing"; renderAll(); }
function selectTargetFromDropdown(needKey, v) { state.jobIndexByNeed[needKey] = v === "" ? null : parseInt(v, 10); state.skillTabByNeed[needKey] = "missing"; renderAll(); }
function selectBaseJob(needKey, v) { state.baseJobByNeed[needKey] = v; renderTool(); }
function setSkillTab(needKey, key) { state.skillTabByNeed[needKey] = key; renderTool(); }
function skipTest() { state.exploreTest.skipped = true; renderAll(); }
function goToTest() {
  const types = DATA.explore.tool.personalityTypes;
  state.exploreTest.personalityType = types[Math.floor(Math.random() * types.length)];
  state.exploreTest.taken = true;
  state.exploreTest.skipped = false;
  renderAll();
}
function resetExplore() { state.exploreTest = { taken: false, skipped: false, personalityType: null }; renderAll(); }

function renderFeed(containerId, items, linkUrl) {
  const el = document.getElementById(containerId);
  if (!items.length) {
    el.innerHTML = `<div class="empty-note">這個分類暫時沒有符合的內容，換個標籤看看吧</div>`;
    return;
  }
  const badge = `<span class="feed-badge on">為你推薦</span>`;
  el.innerHTML = items.map(it => `
    <a class="feed-card" href="${linkUrl}" target="_blank" rel="noopener">
      <div class="tag-row">
        <span class="tag ${it.tag}">${it.tagLabel}</span>
        <span class="feed-source">${it.source}</span>
        ${badge}
      </div>
      <div class="feed-title">${it.title}</div>
      <div class="feed-desc">${it.desc}</div>
      <div class="feed-actions"><span>👏 拍手</span><span>🔖 收藏</span><span>↗ 分享</span></div>
    </a>`).join("");
}

function buildInsertCard(it) {
  const ctaText = it.tag === "course" ? "立即上課" : it.tag === "cert" ? "查看證照資訊" : "立即測驗";
  const ctaClass = it.tag === "quiz" ? "blue" : it.tag === "cert" ? "gold" : "";
  return `
    <div class="feed-card">
      <div class="tag-row">
        <span class="tag ${it.tag}">${it.tagLabel}</span>
        <span class="feed-source">${it.source}</span>
      </div>
      <div class="feed-title">${it.title}</div>
      <div class="feed-desc">${it.desc}</div>
      <span class="feed-cta ${ctaClass}">${ctaText}</span>
    </div>`;
}

function buildMixedInserts(data) {
  const quizzes = data.quizzes || [];
  const certs = data.certificates || [];
  const pool = [];
  const max = Math.max(quizzes.length, certs.length);
  for (let i = 0; i < max; i++) {
    if (quizzes[i]) pool.push(quizzes[i]);
    if (certs[i]) pool.push(certs[i]);
  }
  return pool;
}

function interleaveWithInserts(items, inserts) {
  const result = [];
  let insertIdx = 0;
  let nextInsertAt = 3 + Math.floor(Math.random() * 3);
  items.forEach((it, i) => {
    result.push({ type: "item", data: it });
    if ((i + 1) === nextInsertAt && insertIdx < inserts.length) {
      result.push({ type: "insert", data: inserts[insertIdx] });
      insertIdx++;
      nextInsertAt = i + 1 + 3 + Math.floor(Math.random() * 3);
    }
  });
  return result;
}

function renderFeedWithInserts(containerId, items, linkUrl, inserts) {
  const el = document.getElementById(containerId);
  if (!items.length) {
    el.innerHTML = `<div class="empty-note">這個分類暫時沒有符合的內容，換個標籤看看吧</div>`;
    return;
  }
  const badge = `<span class="feed-badge on">為你推薦</span>`;
  const combined = interleaveWithInserts(items, inserts);
  el.innerHTML = combined.map(entry => {
    if (entry.type === "insert") return buildInsertCard(entry.data);
    const it = entry.data;
    return `
    <a class="feed-card" href="${linkUrl}" target="_blank" rel="noopener">
      <div class="tag-row">
        <span class="tag ${it.tag}">${it.tagLabel}</span>
        <span class="feed-source">${it.source}</span>
        ${badge}
      </div>
      <div class="feed-title">${it.title}</div>
      <div class="feed-desc">${it.desc}</div>
      <div class="feed-actions"><span>👏 拍手</span><span>🔖 收藏</span><span>↗ 分享</span></div>
    </a>`;
  }).join("") + `<div class="feed-end-note">— 已經到底，這是目前的全部內容 —</div>`;
}

function renderFilterRow(containerId, tags, active, setterName) {
  const el = document.getElementById(containerId);
  el.innerHTML = tags.map(t =>
    `<button type="button" class="filter-chip ${t === active ? "active" : ""}" onclick="${setterName}('${t}')">${t}</button>`
  ).join("");
}

function setArticleTag(t) { state.articleTag = t; renderContentHub(); anchorContentHub(); }
function setCommunityTag(t) { state.communityTag = t; renderContentHub(); anchorContentHub(); }
function setClassroomTag(t) { state.classroomTag = t; renderContentHub(); anchorContentHub(); }

function anchorContentHub() {
  const hub = document.getElementById("contentHub");
  const rect = hub.getBoundingClientRect();
  if (rect.top < 0) hub.scrollIntoView({ block: "start" });
}

function toggleFollowClassroom(e, name) {
  e.preventDefault();
  e.stopPropagation();
  if (state.followedClassrooms.has(name)) state.followedClassrooms.delete(name);
  else state.followedClassrooms.add(name);
  renderContentHub();
}

function renderClassroomFeed() {
  const data = currentData();
  const items = state.classroomTag === "已關注"
    ? data.classrooms.filter(c => state.followedClassrooms.has(c.classroomName))
    : data.classrooms;
  const el = document.getElementById("contentFeed");
  if (!items.length) {
    el.innerHTML = `<div class="empty-note">還沒有關注任何共學教室，點擊貼文上的「+ 關注」開始追蹤吧</div>`;
    return;
  }
  const badge = `<span class="feed-badge on">為你推薦</span>`;
  const combined = interleaveWithInserts(items, buildMixedInserts(data));
  el.innerHTML = combined.map(entry => {
    if (entry.type === "insert") return buildInsertCard(entry.data);
    const c = entry.data;
    const followed = state.followedClassrooms.has(c.classroomName);
    const safeName = c.classroomName.replace(/'/g, "\\'");
    return `
    <a class="feed-card" href="https://nabi.104.com.tw/classroom" target="_blank" rel="noopener">
      <div class="tag-row">
        <span class="tag classroom">共學</span>
        <span class="feed-source">${c.classroomName}</span>
        ${badge}
      </div>
      <div class="feed-title">${c.title}</div>
      <div class="feed-desc">${c.desc}</div>
      <div class="feed-actions">
        <span>👏 拍手</span><span>🔖 收藏</span>
        <button type="button" class="classroom-follow-btn ${followed ? "followed" : ""}" onclick="toggleFollowClassroom(event,'${safeName}')">${followed ? "✓ 已關注" : "+ 關注"}</button>
      </div>
    </a>`;
  }).join("") + `<div class="feed-end-note">— 已經到底，這是目前的全部內容 —</div>`;
}

const SECTION_LABELS = { articles: "職場力", community: "職場問答", classroom: "共學教室", aiZone: "AI專區", learning: "學習新知", talent: "人才社群" };
const L1_ICONS = { articles: "📰", community: "💬", classroom: "🎓", aiZone: "🤖", learning: "📚", talent: "🌐" };
const CONTENT_L1_KEYS = ["articles", "community", "classroom"];
const SEE_MORE_LINKS = {
  articles: "https://blog.104.com.tw/?utm_source=104&utm_medium=blackbar2&utm_campaign=nabi",
  community: "https://giver.104.com.tw/questionList/0?orderType=recommend",
  classroom: "https://nabi.104.com.tw/classroom",
};

function selectL1(key) {
  state.activeL1 = key;
  renderContentHub();
  anchorContentHub();
}

function toggleSectionVisible(key) {
  state.sectionVisible[key] = !state.sectionVisible[key];
  renderOrderModal();
  renderContentHub();
}

function renderContentHub() {
  const feedEl = document.getElementById("contentFeed");
  feedEl.classList.add("feed-swapping");
  requestAnimationFrame(() => requestAnimationFrame(() => feedEl.classList.remove("feed-swapping")));

  const data = currentData();
  const visibleKeys = state.sectionOrder.filter(key => state.sectionVisible[key]);
  const row = document.getElementById("l1TagRow");

  if (!visibleKeys.length) {
    row.innerHTML = "";
    document.getElementById("seeMoreLink").style.display = "none";
    document.getElementById("contentIntro").textContent = "所有內容類型都已隱藏，點擊上方「⚙️ 自訂排序」重新開啟";
    document.getElementById("l2Filter").innerHTML = "";
    document.getElementById("contentFeed").innerHTML = "";
    return;
  }
  if (!visibleKeys.includes(state.activeL1)) state.activeL1 = visibleKeys[0];

  row.innerHTML = visibleKeys.map(key => `
    <button type="button" class="filter-chip ${state.activeL1 === key ? "active" : ""}" onclick="selectL1('${key}')">${L1_ICONS[key]} ${SECTION_LABELS[key]}</button>
  `).join("");

  const hasData = CONTENT_L1_KEYS.includes(state.activeL1);
  const seeMoreEl = document.getElementById("seeMoreLink");
  seeMoreEl.style.display = hasData ? "" : "none";
  if (hasData) seeMoreEl.href = SEE_MORE_LINKS[state.activeL1];

  if (!hasData) {
    document.getElementById("contentIntro").textContent = `「${SECTION_LABELS[state.activeL1]}」即將推出，敬請期待`;
    document.getElementById("l2Filter").innerHTML = "";
    document.getElementById("contentFeed").innerHTML = "";
    return;
  }

  document.getElementById("contentIntro").textContent = INTRO[state.need][state.activeL1];

  if (state.activeL1 === "articles") {
    renderFilterRow("l2Filter", ARTICLE_TAGS, state.articleTag, "setArticleTag");
    const items = state.articleTag === "推薦" ? data.articles : data.articles.filter(a => a.category === state.articleTag);
    renderFeedWithInserts("contentFeed", items, SEE_MORE_LINKS.articles, buildMixedInserts(data));
  } else if (state.activeL1 === "community") {
    renderFilterRow("l2Filter", COMMUNITY_TAGS, state.communityTag, "setCommunityTag");
    const items = state.communityTag === "推薦" ? data.community : data.community.filter(c => c.tagLabel === state.communityTag);
    renderFeedWithInserts("contentFeed", items, SEE_MORE_LINKS.community, buildMixedInserts(data));
  } else {
    renderFilterRow("l2Filter", CLASSROOM_TAGS, state.classroomTag, "setClassroomTag");
    renderClassroomFeed();
  }
}

function applySectionOrder() {
  renderContentHub();
}

function openOrderModal() {
  document.getElementById("orderOverlay").classList.add("open");
  renderOrderModal();
}
function closeOrderModal() {
  document.getElementById("orderOverlay").classList.remove("open");
}

function renderOrderModal() {
  const body = document.getElementById("orderModalBody");
  const draggableHtml = state.sectionOrder.map(key => {
    const visible = state.sectionVisible[key];
    return `
    <div class="order-row ${visible ? "" : "hidden-section"}" data-key="${key}">
      <span class="order-drag-handle" onpointerdown="startDragSection(event,'${key}')">☰</span>
      <span class="order-row-label">${L1_ICONS[key]} ${SECTION_LABELS[key]}</span>
      <button type="button" class="order-visibility-btn ${visible ? "on" : "off"}" onclick="toggleSectionVisible('${key}')">${visible ? "👁 顯示中" : "🚫 已隱藏"}</button>
    </div>`;
  }).join("");
  body.innerHTML = `
    <p class="search-scope-hint" style="padding:0 0 10px;">按住 ☰ 拖曳調整內容類型的預設顯示順序（排第一的會是預設開啟的頁籤），點擊右側按鈕可顯示／隱藏該類型；AI專區／學習新知／人才社群目前預設隱藏，開啟後會在內容中心出現「即將推出」頁籤。</p>
    <div id="orderDragList">${draggableHtml}</div>
    <button type="button" class="tool-cta" style="margin-top:16px;" onclick="closeOrderModal()">完成</button>`;
}

let dragState = null;
function startDragSection(e, key) {
  e.preventDefault();
  const list = document.getElementById("orderDragList");
  const draggedEl = Array.from(list.children).find(r => r.dataset.key === key);
  if (!draggedEl) return;
  dragState = { draggedEl };
  draggedEl.classList.add("dragging");
  document.onpointermove = onDragSectionMove;
  document.onpointerup = endDragSection;
}
function onDragSectionMove(e) {
  if (!dragState) return;
  const list = document.getElementById("orderDragList");
  const rows = Array.from(list.children).filter(r => r !== dragState.draggedEl);
  const y = e.clientY;
  let target = null;
  for (const row of rows) {
    const rect = row.getBoundingClientRect();
    if (y < rect.top + rect.height / 2) { target = row; break; }
  }
  if (target) list.insertBefore(dragState.draggedEl, target);
  else list.appendChild(dragState.draggedEl);
}
function endDragSection() {
  if (!dragState) return;
  dragState.draggedEl.classList.remove("dragging");
  document.onpointermove = null;
  document.onpointerup = null;
  const list = document.getElementById("orderDragList");
  state.sectionOrder = Array.from(list.children).map(r => r.dataset.key);
  applySectionOrder();
  dragState = null;
}

function buildSearchIndex() {
  const items = [];
  Object.keys(DATA).filter(k => k !== "default").forEach(needKey => {
    const d = DATA[needKey];
    d.articles.forEach(it => items.push(it));
    d.community.forEach(it => items.push(it));
    d.courses.forEach(it => items.push(it));
    d.quizzes.forEach(it => items.push(it));
    (d.certificates || []).forEach(it => items.push(it));
    d.classrooms.forEach(it => items.push(it));
  });
  return items;
}
const SEARCH_INDEX = buildSearchIndex();

function openSearch() {
  document.getElementById("searchOverlay").classList.add("open");
  const input = document.getElementById("searchInput");
  input.value = "";
  handleSearchInput("");
  setTimeout(() => input.focus(), 50);
}
function closeSearch() {
  document.getElementById("searchOverlay").classList.remove("open");
}

function handleSearchInput(query) {
  const el = document.getElementById("searchResults");
  const q = query.trim().toLowerCase();
  if (!q) {
    el.innerHTML = `<div class="search-hint">輸入關鍵字開始搜尋</div>`;
    return;
  }
  const matches = SEARCH_INDEX.filter(it =>
    it.title.toLowerCase().includes(q) || (it.desc && it.desc.toLowerCase().includes(q))
  );
  if (!matches.length) {
    el.innerHTML = `<div class="search-hint">找不到符合「${query}」的內容，換個關鍵字試試</div>`;
    return;
  }
  el.innerHTML = `<div class="search-result-count">共 ${matches.length} 筆結果</div>` +
    matches.map(it => `
      <button type="button" class="search-result-item" onclick="closeSearch()">
        <span class="tag ${it.tag}">${it.tagLabel}</span>
        <span class="info">
          <div class="title">${it.title}</div>
          <div class="source">${it.source}</div>
        </span>
      </button>`).join("");
}

function renderAll() {
  renderNeeds();
  renderPersonalizeBanner();
  renderTool();
  renderPlanBadge();
  renderContentHub();
}

renderAll();
</script>
